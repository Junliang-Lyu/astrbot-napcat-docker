services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqbot-napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=astrbot
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
      - ./data:/AstrBot/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6099 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - astrbot_network
    depends_on:
      astrbot:
        condition: service_healthy

  astrbot:
    image: soulter/astrbot:latest
    container_name: qqbot-astrbot
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${ASTRBOT_WEBUI_PORT:-6185}:6185"
    expose:
      - "6199"
    volumes:
      - ./data:/AstrBot/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6185 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - astrbot_network

networks:
  astrbot_network:
    driver: bridge